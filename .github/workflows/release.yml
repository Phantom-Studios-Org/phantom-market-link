name: Release

# On a published GitHub Release (or manual dispatch against an existing tag):
# build every version, then publish each jar to Modrinth + CurseForge and attach
# it to the GitHub Release. One store version per Minecraft version.
#
# Required repo config before this works:
#   - Variable  MODRINTH_ID     : the Modrinth project id/slug (Settings → Variables)
#   - Secret    MODRINTH_TOKEN  : a Modrinth API token with write scope (Settings → Secrets)
#   - Secret    CF_API_TOKEN    : a CurseForge API token (account-wide, from
#                                 authors.curseforge.com → API Tokens)
# A store whose id/token pair is still empty is skipped, so releases keep landing
# on GitHub (and on the store that IS approved) while the other one is pending.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0) — created by the workflow if it does not exist
        required: true

permissions:
  contents: write   # mc-publish attaches the jars to the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all versions
        run: |
          chmod +x gradlew
          ./gradlew chiseledBuild
      - name: Collect jars
        run: |
          mkdir -p dist
          find versions -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} dist/ \;
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: dist/*.jar
          if-no-files-found: error

  # On manual dispatch, create the tag + GitHub Release with GITHUB_TOKEN so the
  # release is authored by github-actions[bot] rather than a personal account.
  # On the `release: published` trigger the release already exists and this is a no-op.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "$TAG" --notes "PhantomMarket Link $TAG"

  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false   # one version failing shouldn't block the others
      matrix:
        # node = Stonecutter subproject; mc = the Minecraft version(s) to tag on
        # the stores; java = the toolchain that node compiles with (see the
        # `javaVersion` switch in build.gradle.kts). The jar file names end with
        # "+<node>.jar".
        include:
          - { node: 1.20.1-fabric,  mc: "1.20.1",  java: 17 }
          - { node: 1.20.4-fabric,  mc: "1.20.4",  java: 17 }
          - { node: 1.21.1-fabric,  mc: "1.21.1",  java: 21 }
          - { node: 1.21.4-fabric,  mc: "1.21.4",  java: 21 }
          - { node: 1.21.11-fabric, mc: "1.21.11", java: 21 }
          - { node: 26.1-fabric,    mc: "26.1",    java: 25 }
          - { node: 26.2-fabric,    mc: "26.2",    java: 25 }
          - { node: 26.3-fabric,    mc: "26.3",    java: 25 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: dist

      - name: Locate this version's jar
        id: jar
        run: |
          f=$(ls dist/*+${{ matrix.node }}.jar)
          test -f "$f" || { echo "no jar for ${{ matrix.node }}"; exit 1; }
          echo "path=$f" >> "$GITHUB_OUTPUT"

      # Upstream renamed the account (Kir-Antipov -> Kira-NT); the old path only
      # still resolves through a GitHub redirect, so reference it by its real
      # name and pin the exact release rather than the moving v3.3 tag.
      - name: Publish to Modrinth + CurseForge + GitHub Release
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # https://www.curseforge.com/minecraft/mc-mods/phantommarket-link
          curseforge-id: 1702444
          curseforge-token: ${{ secrets.CF_API_TOKEN }}

          github-tag: ${{ inputs.tag || github.event.release.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: ${{ steps.jar.outputs.path }}
          name: PhantomMarket Link ${{ inputs.tag || github.event.release.tag_name }} (MC ${{ matrix.mc }})
          version: ${{ inputs.tag || github.event.release.tag_name }}+mc${{ matrix.mc }}
          version-type: release

          loaders: fabric
          game-versions: ${{ matrix.mc }}
          # Don't let an unknown game version silently widen into a wrong one.
          game-version-filter: any
          java: ${{ matrix.java }}
          # Declared explicitly so mc-publish doesn't guess from fabric.mod.json.
          # Each store wants its own project identifier, so qualify them: Modrinth
          # takes base62 IDs (slugs containing '-' are rejected), CurseForge takes
          # its numeric project id. The leading name is only a label.
          dependencies: |-
            litematica(required){modrinth:bEpr0Arc}{curseforge:308892}
            malilib(required){modrinth:GcWjdA9I}{curseforge:303119}
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}

          retry-attempts: 3
          retry-delay: 10000
